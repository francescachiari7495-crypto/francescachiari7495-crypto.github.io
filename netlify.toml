# EValue Consulting — sito statico, nessuna build.
# Novembre 2026: rimossa la regola "/* -> /index.html" che serviva
# la pagina intera a qualsiasi indirizzo (anche ai bot). Gli indirizzi
# inesistenti ora ricevono 404.html, che pesa meno di 1 KB.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Immagini: il browser le tiene in memoria per una settimana
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
